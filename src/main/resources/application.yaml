server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC
    username: root
    password: root
  redis:
    host: 127.0.0.1
    port: 6379
    password:
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug
  redisson:

    single-server-config:
      address: redis://127.0.0.1:6379
      password: null
      connection-pool-size: 10
langchain4j:
    openai:
      base-url: https://api.deepseek.com/v1
      api-key: sk-fd3740967b2945fa8c4affd0b78ed9a9
      model-name: doubao-pro-32k
      timeout: 60s
      max-retries: 2
      temperature: 0.7
      log-requests: true
      log-responses: true